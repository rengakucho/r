<meta property="og:description" content="AI秘書の案件メールの見張りを、Jevで振り分けて迷った分だけOpus 5.5に回す形にした実験の記録です。">

<body>
<p style="font-family:sans-serif;color:#666;">記事へ移動しています…</p>
<script>
(function () {
  var dest = "https://note.com/renkon40";
  var beacon = "https://script.google.com/macros/s/AKfycbwRRC_LUTQJ8X_sw4cDqqjqYS88YEhU6AcC351CY-6fjAj1M8zlYc07wqxIEePdvxHBRQ/exec?s=" + encodeURIComponent("0225-x-reply");
  // keepalive付きのリクエストはページ遷移後も送信が続くため、遷移で打ち切られない。
  // 対応していない環境では画像ビーコンへ落とす（2026-08-23: 150ms後に必ず遷移する実装だと
  // GASの302往復が間に合わずクリックを取りこぼす恐れがあったため変更。遅延は増やさない）。
  try {
    if (window.fetch) { fetch(beacon, {mode: "no-cors", keepalive: true}); }
    else { new Image().src = beacon; }
  } catch (e) { try { new Image().src = beacon; } catch (e2) {} }
  setTimeout(function () { location.replace(dest); }, 150);
  document.addEventListener("DOMContentLoaded", function () {
    var a = document.createElement("a");
    a.href = dest;
    a.textContent = "自動で移動しない場合はこちら";
    document.body.appendChild(a);
  });
})();
</script>
