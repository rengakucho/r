<meta charset="utf-8">

<title>れん学長のAIツール実験室（YouTube）</title>
<meta property="og:title" content="れん学長のAIツール実験室（YouTube）">
<meta property="og:description" content="AIツールを実際に試した結果を動画で公開しています。">
<meta property="og:type" content="article">

</head>
<body>
<p style="font-family:sans-serif;color:#666;">記事へ移動しています…</p>
<script>
(function () {
  var dest = "https://www.youtube.com/@rengaku-ai2";
  var beacon = "https://script.google.com/macros/s/AKfycbwRRC_LUTQJ8X_sw4cDqqjqYS88YEhU6AcC351CY-6fjAj1M8zlYc07wqxIEePdvxHBRQ/exec?s=" + encodeURIComponent("youtube-ig-profile");
  // keepalive付きのリクエストはページ遷移後も送信が続くため、遷移で打ち切られない。
  // 対応していない環境では画像ビーコンへ落とす（2026-08-23: 150ms後に必ず遷移する実装だと
  // GASの302往復が間に合わずクリックを取りこぼす恐れがあったため変更。遅延は増やさない）。
  try {
    if (window.fetch) { fetch(beacon, {mode: "no-cors", keepalive: true}); }
    else { new Image().src = beacon; }
  } catch (e) { try { new Image().src = beacon; } catch (e2) {} }
  setTimeout(function () { location.replace(dest); }, 150);
  document.addEventListener("DOMContentLoaded", function () {
    var a = document.createElement("a");
    a.href = dest;
    a.textContent = "自動で移動しない場合はこちら";
    document.body.appendChild(a);
  });
})();
</script>
<noscript><a href="https://www.youtube.com/@rengaku-ai2">続きはこちら</a></noscript>
</body>
</html>
