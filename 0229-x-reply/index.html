<meta property="og:title" content="【AI代の重さに効く】7分野で試したら、メール仕分けは全問正解。出たばっかりの「GPT-6 Sol・Luna」が安すぎた">
<meta property="og:description" content="GPT-6 Sol と Luna を、Claude Opus 5.5 や GPT-6 Astra などと7つの実務で比べた結果と、使ったプロンプトをまとめました。">

<body>
<p style="font-family:sans-serif;color:#666;">記事へ移動しています…</p>
<script>
(function () {
  var dest = "https://note.com/renkon40/n/n050ebf266179";
  var beacon = "https://script.google.com/macros/s/AKfycbwRRC_LUTQJ8X_sw4cDqqjqYS88YEhU6AcC351CY-6fjAj1M8zlYc07wqxIEePdvxHBRQ/exec?s=" + encodeURIComponent("0229-x-reply");
  // keepalive付きのリクエストはページ遷移後も送信が続くため、遷移で打ち切られない。
  // 対応していない環境では画像ビーコンへ落とす（2026-08-23: 150ms後に必ず遷移する実装だと
  // GASの302往復が間に合わずクリックを取りこぼす恐れがあったため変更。遅延は増やさない）。
  try {
    if (window.fetch) { fetch(beacon, {mode: "no-cors", keepalive: true}); }
    else { new Image().src = beacon; }
  } catch (e) { try { new Image().src = beacon; } catch (e2) {} }
  setTimeout(function () { location.replace(dest); }, 150);
  document.addEventListener("DOMContentLoaded", function () {
    var a = document.createElement("a");
    a.href = dest;
    a.textContent = "自動で移動しない場合はこちら";
    document.body.appendChild(a);
  });
})();
</script>
